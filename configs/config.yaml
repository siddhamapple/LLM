project:
  name: "LLM Development and Fine-Tuning"
  seed: 42

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "models"
  logs_dir: "logs"

logging:
  level: "INFO" # DEBUG | INFO | WARNING | ERROR
  log_to_file: true
  file_name: "train.log"

model:
  model_name: "distilbert-base-uncased" # can change to gpt2/roberta-base etc.
  from_scratch: false # true if you’ll pre-train tiny transformer
  max_length: 256

training:
  task_type: "classification" # classification | causal_lm | seq2seq
  train_batch_size: 16
  eval_batch_size: 16
  num_epochs: 3
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  fp16: false

optimization:
  lora:
    enabled: false
    r: 16
    alpha: 32
    dropout: 0.05

decoding: # used for generation tasks
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  max_new_tokens: 128

evaluation:
  metrics: ["accuracy", "f1"] # add "bleu", "rouge" for gen tasks
  validation_split: "validation"

data:
  train_file: "data/processed/train.jsonl"
  eval_file: "data/processed/val.jsonl"
  text_field: "text"
  label_field: "label"
  num_labels: 2
